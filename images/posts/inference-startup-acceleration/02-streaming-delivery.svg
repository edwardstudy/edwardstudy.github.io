<svg baseProfile="full" height="760" version="1.1" viewBox="0 0 1360 760" width="1360" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#FFFFFF" height="760" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1360" x="0" y="0" /><rect fill="#18324B" height="12" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1360" x="0" y="0" /><rect fill="#E8F2FE" height="38" rx="9" ry="9" stroke="none" stroke-width="1.5" width="84" x="64" y="54" /><text fill="#18324B" font-family="Noto Sans CJK SC" font-size="19" font-weight="bold" text-anchor="middle" x="106.0" y="79.46000000000001">图 2</text><text fill="#193149" font-family="Noto Sans CJK SC" font-size="35" font-weight="bold" text-anchor="start" x="168" y="83">流式加载：权重就绪后逐批交付</text><text fill="#64748B" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" text-anchor="start" x="67" y="124">强调“何时可以交付”，不要求多个 I/O 并发，也不保证 GPU 搬运重叠</text><line stroke="#E7EDF3" stroke-width="2" x1="65" x2="1295" y1="152" y2="152" /><rect fill="#F6F9FC" height="203" rx="12" ry="12" stroke="#DCE5EE" stroke-width="1.5" width="1232" x="64" y="181" /><text fill="#193149" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" text-anchor="start" x="92" y="219">整批交付（Batch delivery）</text><text fill="#64748B" font-family="Noto Sans CJK SC" font-size="18" font-weight="normal" text-anchor="start" x="93" y="249">先读取全部权重，再统一交给加载器</text><rect fill="#4C83C4" height="52" rx="7" ry="7" stroke="none" stroke-width="1.5" width="205" x="292" y="277" /><text fill="#FFFFFF" font-family="Noto Sans CJK SC" font-size="20" font-weight="bold" text-anchor="middle" x="394.5" y="310.2">读取 A</text><text fill="#64748B" font-family="Noto Sans CJK SC" font-size="16" font-weight="normal" text-anchor="start" x="292" y="353">0s</text><rect fill="#4C83C4" height="52" rx="7" ry="7" stroke="none" stroke-width="1.5" width="205" x="506" y="277" /><text fill="#FFFFFF" font-family="Noto Sans CJK SC" font-size="20" font-weight="bold" text-anchor="middle" x="608.5" y="310.2">读取 B</text><text fill="#64748B" font-family="Noto Sans CJK SC" font-size="16" font-weight="normal" text-anchor="start" x="506" y="353">2s</text><rect fill="#4C83C4" height="52" rx="7" ry="7" stroke="none" stroke-width="1.5" width="205" x="720" y="277" /><text fill="#FFFFFF" font-family="Noto Sans CJK SC" font-size="20" font-weight="bold" text-anchor="middle" x="822.5" y="310.2">读取 C</text><text fill="#64748B" font-family="Noto Sans CJK SC" font-size="16" font-weight="normal" text-anchor="start" x="720" y="353">4s</text><text fill="#64748B" font-family="Noto Sans CJK SC" font-size="16" font-weight="normal" text-anchor="start" x="934" y="353">6s</text><line stroke="#D78924" stroke-dasharray="5,5" stroke-width="2" x1="937" x2="937" y1="262" y2="351" /><rect fill="#FFF3D9" height="44" rx="9" ry="9" stroke="none" stroke-width="1.5" width="278" x="968" y="284" /><text fill="#D78924" font-family="Noto Sans CJK SC" font-size="17" font-weight="bold" text-anchor="middle" x="1107.0" y="311.78">6s：统一交付 A/B/C</text><rect fill="#F6F9FC" height="288" rx="12" ry="12" stroke="#DCE5EE" stroke-width="1.5" width="1232" x="64" y="408" /><text fill="#193149" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" text-anchor="start" x="92" y="448">流式交付（Streaming delivery）</text><text fill="#64748B" font-family="Noto Sans CJK SC" font-size="18" font-weight="normal" text-anchor="start" x="93" y="477">每批就绪即可交付，后续权重继续读取</text><rect fill="#4C83C4" height="52" rx="7" ry="7" stroke="none" stroke-width="1.5" width="205" x="292" y="500" /><text fill="#FFFFFF" font-family="Noto Sans CJK SC" font-size="20" font-weight="bold" text-anchor="middle" x="394.5" y="533.2">读取 A</text><line stroke="#D78924" stroke-width="3" x1="501" x2="501" y1="560" y2="609" /><circle cx="501" cy="560" fill="#D78924" r="7" /><rect fill="#FFF3D9" height="43" rx="9" ry="9" stroke="none" stroke-width="1.5" width="160" x="421" y="609" /><text fill="#D78924" font-family="Noto Sans CJK SC" font-size="17" font-weight="bold" text-anchor="middle" x="501.0" y="636.28">交付 A</text><text fill="#64748B" font-family="Noto Sans CJK SC" font-size="16" font-weight="normal" text-anchor="start" x="292" y="579">0s</text><rect fill="#4C83C4" height="52" rx="7" ry="7" stroke="none" stroke-width="1.5" width="205" x="506" y="500" /><text fill="#FFFFFF" font-family="Noto Sans CJK SC" font-size="20" font-weight="bold" text-anchor="middle" x="608.5" y="533.2">读取 B</text><line stroke="#D78924" stroke-width="3" x1="715" x2="715" y1="560" y2="609" /><circle cx="715" cy="560" fill="#D78924" r="7" /><rect fill="#FFF3D9" height="43" rx="9" ry="9" stroke="none" stroke-width="1.5" width="160" x="635" y="609" /><text fill="#D78924" font-family="Noto Sans CJK SC" font-size="17" font-weight="bold" text-anchor="middle" x="715.0" y="636.28">交付 B</text><text fill="#64748B" font-family="Noto Sans CJK SC" font-size="16" font-weight="normal" text-anchor="start" x="506" y="579">2s</text><rect fill="#4C83C4" height="52" rx="7" ry="7" stroke="none" stroke-width="1.5" width="205" x="720" y="500" /><text fill="#FFFFFF" font-family="Noto Sans CJK SC" font-size="20" font-weight="bold" text-anchor="middle" x="822.5" y="533.2">读取 C</text><line stroke="#D78924" stroke-width="3" x1="929" x2="929" y1="560" y2="609" /><circle cx="929" cy="560" fill="#D78924" r="7" /><rect fill="#FFF3D9" height="43" rx="9" ry="9" stroke="none" stroke-width="1.5" width="160" x="849" y="609" /><text fill="#D78924" font-family="Noto Sans CJK SC" font-size="17" font-weight="bold" text-anchor="middle" x="929.0" y="636.28">交付 C</text><text fill="#64748B" font-family="Noto Sans CJK SC" font-size="16" font-weight="normal" text-anchor="start" x="720" y="579">4s</text><text fill="#64748B" font-family="Noto Sans CJK SC" font-size="16" font-weight="normal" text-anchor="start" x="934" y="579">6s</text><text fill="#64748B" font-family="Noto Sans CJK SC" font-size="17" font-weight="normal" text-anchor="start" x="71" y="735">注：交付粒度可为张量或数据批次；流式交付与“读取和 H2D 实际并行执行”是两回事。</text></svg>