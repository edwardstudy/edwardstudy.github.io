<svg baseProfile="full" height="760" version="1.1" viewBox="0 0 1360 760" width="1360" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#FFFFFF" height="760" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1360" x="0" y="0" /><rect fill="#18324B" height="12" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1360" x="0" y="0" /><rect fill="#E8F2FE" height="38" rx="9" ry="9" stroke="none" stroke-width="1.5" width="84" x="64" y="54" /><text fill="#18324B" font-family="Noto Sans CJK SC" font-size="19" font-weight="bold" text-anchor="middle" x="106.0" y="79.46000000000001">图 1</text><text fill="#193149" font-family="Noto Sans CJK SC" font-size="35" font-weight="bold" text-anchor="start" x="168" y="83">并发读取：让多个 I/O 请求同时进行</text><text fill="#64748B" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" text-anchor="start" x="67" y="124">同一存储读取阶段内提高并行度；不涉及 GPU 搬运</text><line stroke="#E7EDF3" stroke-width="2" x1="65" x2="1295" y1="152" y2="152" /><rect fill="#F6F9FC" height="208" rx="12" ry="12" stroke="#DCE5EE" stroke-width="1.5" width="1232" x="64" y="180" /><text fill="#193149" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" text-anchor="start" x="94" y="220">串行读取</text><text fill="#64748B" font-family="Noto Sans CJK SC" font-size="18" font-weight="normal" text-anchor="start" x="94" y="252">1 个读取任务依次执行 A → D</text><rect fill="#4C83C4" height="62" rx="7" ry="7" stroke="none" stroke-width="1.5" width="204" x="280" y="271" /><text fill="#FFFFFF" font-family="Noto Sans CJK SC" font-size="22" font-weight="bold" text-anchor="middle" x="382.0" y="309.92">读取 A</text><rect fill="#4C83C4" height="62" rx="7" ry="7" stroke="none" stroke-width="1.5" width="204" x="494" y="271" /><text fill="#FFFFFF" font-family="Noto Sans CJK SC" font-size="22" font-weight="bold" text-anchor="middle" x="596.0" y="309.92">读取 B</text><rect fill="#4C83C4" height="62" rx="7" ry="7" stroke="none" stroke-width="1.5" width="204" x="708" y="271" /><text fill="#FFFFFF" font-family="Noto Sans CJK SC" font-size="22" font-weight="bold" text-anchor="middle" x="810.0" y="309.92">读取 C</text><rect fill="#4C83C4" height="62" rx="7" ry="7" stroke="none" stroke-width="1.5" width="204" x="922" y="271" /><text fill="#FFFFFF" font-family="Noto Sans CJK SC" font-size="22" font-weight="bold" text-anchor="middle" x="1024.0" y="309.92">读取 D</text><line stroke="#64748B" stroke-width="1.7" x1="280" x2="1126" y1="350" y2="350" /><text fill="#64748B" font-family="Noto Sans CJK SC" font-size="16" font-weight="normal" text-anchor="middle" x="280" y="373">0s</text><text fill="#64748B" font-family="Noto Sans CJK SC" font-size="16" font-weight="normal" text-anchor="middle" x="494" y="373">2s</text><text fill="#64748B" font-family="Noto Sans CJK SC" font-size="16" font-weight="normal" text-anchor="middle" x="708" y="373">4s</text><text fill="#64748B" font-family="Noto Sans CJK SC" font-size="16" font-weight="normal" text-anchor="middle" x="922" y="373">6s</text><text fill="#64748B" font-family="Noto Sans CJK SC" font-size="16" font-weight="normal" text-anchor="middle" x="1136" y="373">8s</text><rect fill="#FFF3D9" height="62" rx="9" ry="9" stroke="none" stroke-width="1.5" width="113" x="1145" y="269" /><text fill="#D78924" font-family="Noto Sans CJK SC" font-size="28" font-weight="bold" text-anchor="middle" x="1201.5" y="309.52">8s</text><rect fill="#F6F9FC" height="259" rx="12" ry="12" stroke="#DCE5EE" stroke-width="1.5" width="1232" x="64" y="410" /><text fill="#193149" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" text-anchor="start" x="94" y="453">并发读取</text><text fill="#64748B" font-family="Noto Sans CJK SC" font-size="18" font-weight="normal" text-anchor="start" x="94" y="486">4 个读取任务同时进行</text><text fill="#64748B" font-family="Noto Sans CJK SC" font-size="17" font-weight="normal" text-anchor="end" x="244" y="531">I/O 1</text><rect fill="#4C83C4" height="28" rx="7" ry="7" stroke="none" stroke-width="1.5" width="209" x="280" y="510" /><text fill="#FFFFFF" font-family="Noto Sans CJK SC" font-size="16" font-weight="bold" text-anchor="middle" x="384.5" y="529.76">读取 A</text><text fill="#64748B" font-family="Noto Sans CJK SC" font-size="17" font-weight="normal" text-anchor="end" x="244" y="565">I/O 2</text><rect fill="#4C83C4" height="28" rx="7" ry="7" stroke="none" stroke-width="1.5" width="209" x="280" y="544" /><text fill="#FFFFFF" font-family="Noto Sans CJK SC" font-size="16" font-weight="bold" text-anchor="middle" x="384.5" y="563.76">读取 B</text><text fill="#64748B" font-family="Noto Sans CJK SC" font-size="17" font-weight="normal" text-anchor="end" x="244" y="599">I/O 3</text><rect fill="#4C83C4" height="28" rx="7" ry="7" stroke="none" stroke-width="1.5" width="209" x="280" y="578" /><text fill="#FFFFFF" font-family="Noto Sans CJK SC" font-size="16" font-weight="bold" text-anchor="middle" x="384.5" y="597.76">读取 C</text><text fill="#64748B" font-family="Noto Sans CJK SC" font-size="17" font-weight="normal" text-anchor="end" x="244" y="633">I/O 4</text><rect fill="#4C83C4" height="28" rx="7" ry="7" stroke="none" stroke-width="1.5" width="209" x="280" y="612" /><text fill="#FFFFFF" font-family="Noto Sans CJK SC" font-size="16" font-weight="bold" text-anchor="middle" x="384.5" y="631.76">读取 D</text><line stroke="#64748B" stroke-width="1.7" x1="280" x2="1126" y1="650" y2="650" /><text fill="#64748B" font-family="Noto Sans CJK SC" font-size="16" font-weight="normal" text-anchor="middle" x="280" y="675">0s</text><text fill="#64748B" font-family="Noto Sans CJK SC" font-size="16" font-weight="normal" text-anchor="middle" x="494" y="675">2s</text><text fill="#64748B" font-family="Noto Sans CJK SC" font-size="16" font-weight="normal" text-anchor="middle" x="708" y="675">4s</text><text fill="#64748B" font-family="Noto Sans CJK SC" font-size="16" font-weight="normal" text-anchor="middle" x="922" y="675">6s</text><text fill="#64748B" font-family="Noto Sans CJK SC" font-size="16" font-weight="normal" text-anchor="middle" x="1136" y="675">8s</text><rect fill="#DEF8F1" height="62" rx="9" ry="9" stroke="none" stroke-width="1.5" width="113" x="1145" y="536" /><text fill="#159B89" font-family="Noto Sans CJK SC" font-size="28" font-weight="bold" text-anchor="middle" x="1201.5" y="576.52">2s</text><text fill="#64748B" font-family="Noto Sans CJK SC" font-size="17" font-weight="normal" text-anchor="start" x="68" y="728">注：时间为理想化示意。并发读取的实际收益受存储带宽、设备队列深度及 I/O 竞争影响。</text></svg>